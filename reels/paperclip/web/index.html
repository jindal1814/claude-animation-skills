<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Poppins;font-weight:700 800;src:url(fonts/Poppins-Bold.ttf)}
@font-face{font-family:Lora;font-weight:400 700;src:url(fonts/Lora-Variable.ttf)}
body{margin:0;background:#000}</style></head><body>
<canvas id="c"></canvas>
<script>
// captions: the voiceover as written, 1-3 words, two-thirds down, clear of the bottom quarter and right edge;
// numbers and names of people, places and brands in yellow
const YELLOW = /^(one|fourteen|two-storey|kyle|macdonald's|yahk|phoenix|alice|cooper|kiss|corbin|bernsen|saskatchewan|kipling)$/i;
window.CAP_STYLE = { maxWords: 3, y: 1280, size: 74, outline: 7, maxWidth: 780,
  yellow: (w, i) => { const c = w.replace(/^["“]+|[.,?!:…"”]+$/g, ''); if (/^one$/i.test(c) && i > 0 && WORDS[i - 1].w.toLowerCase() === 'that') return false; return YELLOW.test(c); } };
// title card: upper third for the opening, fading out as the second line starts
window.OVERLAY = (ctx, t) => {
  const end = 3.44, a = 1 - clamp((t - end) / .3); if (a <= 0) return;
  ctx.globalAlpha = a;
  rrect(ctx, 540 - 200, 300, 400, 64, 32); ctx.fillStyle = '#e0392f'; ctx.fill();
  text(ctx, 'ZERO TO EMPIRE #1', 540, 333, 34, '#fff', '#000', 0, 'Poppins', 700);
  text(ctx, 'ONE RED PAPERCLIP', 540, 450, 92, '#fff', '#000', 12, 'Poppins', 800);
  text(ctx, 'ONE RED PAPERCLIP', 540, 450, 92, '#fff', '#000', 0, 'Poppins', 800);
  ctx.globalAlpha = 1;
};
</script>
<script src="lib.js"></script><script src="chars.js"></script><script src="env.js"></script><script src="env2.js"></script><script src="words.js"></script><script src="warp.js"></script><script src="shots.js"></script><script src="main.js"></script>
</body></html>
